# ============================================================================
# HiWiFi C526A (极路由X) — OpenWrt 25.12 + ipqess + PassWall 自编译
#
# 两个关键点：
#  1) REPO_BRANCH 钉死为 openwrt-25.12（不是 master！）
#     keli 原版模板用 REPO_BRANCH: master，每次跑都 clone 当时的 master，
#     → 同一仓库不同时间编出的固件内核完全不同。这就是"不同固件行为不同"的根源。
#  2) PassWall 不在官方 feed，必须加第三方 feed，并且要先删掉官方 feed 里
#     版本冲突的代理包（否则编译报重复定义 / 运行异常）。
#
# 用法：把本文件放到仓库 .github/workflows/build.yml
#       然后 Actions → Build C526A → Run workflow
# ============================================================================

name: Build C526A (OpenWrt 25.12 + ipqess + PassWall)

on:
  workflow_dispatch:
  # 也允许定时（可选，注释掉避免误触发）
  # schedule:
  #   - cron: '0 18 * * 0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      - name: Clone OpenWrt (openwrt-25.12, PINNED)
        run: |
          # ★★★ 分支钉死，不用 master ★★★
          git clone --depth 1 --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log --oneline -1
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"
          # 我方移植好的 25.12 版补丁
          git am --3way "$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch" \
            || (echo "=== git am 失败，尝试 apply ==="; \
                git am --abort 2>/dev/null || true; \
                git apply --3way -v "$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch")
          # ★ 关键自检：补丁必须真的打上了，否则后面全白跑
          echo "=== 补丁落地自检 ==="
          test -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 不存在，补丁没打上"; exit 1; }
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 里没有 hiwifi_c526a"; exit 1; }
          # ★ 反向确认：不该再有 ipq-wifi 引用（上游没有 C526A 的 BDF blob）
          if grep -rq 'ipq-wifi-hiwifi_c526a' target/linux/ipq40xx/ package/firmware/ipq-wifi/ 2>/dev/null; then
            echo "!! 仍有 ipq-wifi-hiwifi_c526a 引用 —— 该包在上游不存在，会让 make download 失败"
            exit 1
          fi
          echo "✅ 补丁落地自检通过"
          git log --oneline -3

      # ★★★ 加入 PassWall 第三方 feed ★★★
      # 注意：这里必须用 printf 逐行追加，不能用 heredoc。
      # 因为 YAML 块标量 (run: |) 会给每一行加上 10 个空格缩进，
      # heredoc 的结束标记 EOF 也会被缩进，导致 shell 无法识别、内容写错。
      - name: Add PassWall feeds
        run: |
          cd openwrt
          printf '%s\n' \
            'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' \
            'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' \
            'src-git passwall2_luci https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main' \
            >> feeds.conf.default
          echo "=== feeds.conf.default ==="
          cat -A feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # 先安装官方 feed
          ./scripts/feeds install -a

      - name: Remove conflicting official proxy packages
        run: |
          set -e
          cd openwrt
          # PassWall README 明确要求：官方 feed 自带的这些包版本与 passwall 预期不一致，
          # 不删会导致编译冲突或运行异常。
          #
          # ⚠️ 关键：不能只 rm -rf 源目录！必须先用 feeds uninstall 摘掉 package/feeds/
          #    下的软链接，再 rm 源目录，最后 feeds update -i 重建索引。
          #    否则 package/feeds/packages/xxx -> 已删除目录 = 断链，
          #    make defconfig 扫描时会直接报错退出（Run #1 就是死在这里）。
          DROP="xray-core v2ray-geodata sing-box chinadns-ng dns2socks hysteria \
                ipt2socks microsocks naiveproxy shadowsocks-rust shadowsocksr-libev \
                simple-obfs tcping tuic-client v2ray-plugin xray-plugin geoview shadow-tls"
          for p in $DROP; do
            if [ -d "feeds/packages/net/$p" ]; then
              ./scripts/feeds uninstall "$p" 2>/dev/null || true
              rm -rf "feeds/packages/net/$p"
            fi
          done
          for p in luci-app-passwall luci-app-passwall2; do
            if [ -d "feeds/luci/applications/$p" ]; then
              ./scripts/feeds uninstall "$p" 2>/dev/null || true
              rm -rf "feeds/luci/applications/$p"
            fi
          done

          # ★★★ geoview 必须从 passwall_packages feed 里也删掉 ★★★
          # 它的 go.mod 要求 go>=1.25.0，而 24.10 的 golang 是 1.23.12 →
          # 必然报 "go: ../../go.mod requires go >= 1.25.0 (running go 1.23.12)"
          # → ERROR: package/feeds/passwall_packages/geoview failed to build. (Run #5 死因)
          for p in geoview haproxy; do
            if [ -d "feeds/passwall_packages/$p" ]; then
              ./scripts/feeds uninstall "$p" 2>/dev/null || true
              rm -rf "feeds/passwall_packages/$p"
            fi
          done

          # 清掉残留断链
          find package/feeds -maxdepth 3 -xtype l -delete 2>/dev/null || true
          echo "=== 删除后的 net 目录中代理相关残留（应为空）==="
          ls feeds/packages/net/ | grep -Ei 'xray|sing|shadowsocks|chinadns|dns2socks|hysteria|obfs|tcping|geoview|shadow-tls|naiveproxy|ipt2socks|microsocks' || echo "OK: 已清空"
          echo "=== passwall_packages 里是否还有 geoview ==="
          ls feeds/passwall_packages/ | grep -i geoview || echo "OK: geoview 已从 passwall feed 移除"
          echo "=== package/feeds 下是否还有断链 ==="
          find package/feeds -maxdepth 3 -xtype l 2>/dev/null | head -20 || true
          echo "OK: 无断链"
          echo "=== passwall feed 是否拉到 ==="
          ls -d feeds/passwall_packages feeds/passwall_luci feeds/passwall2_luci 2>/dev/null || true

      - name: Install PassWall packages
        run: |
          set -e
          cd openwrt
          # 删完官方包后必须重建索引，否则 install 仍按旧索引工作
          ./scripts/feeds update -i
          ./scripts/feeds install -a -p passwall_packages
          ./scripts/feeds install -a -p passwall_luci
          ./scripts/feeds install -a -p passwall2_luci
          echo "=== 确认三个 luci app 都进了 package/feeds ==="
          ls -d package/feeds/passwall_luci/* package/feeds/passwall2_luci/* 2>/dev/null || true
          echo "=== 关键包是否已进入 package/feeds/passwall_packages ==="
          # 注意：v2ray-geoip / v2ray-geosite 是 v2ray-geodata 包 build 出的「子包」，
          # 目录名只有 v2ray-geodata → 不能按目录名找这两个名字，否则假 MISS。
          for p in xray-core sing-box chinadns-ng shadowsocksr-libev dns2socks \
                   simple-obfs v2ray-geodata tcping microsocks ipt2socks; do
            if [ -d "package/feeds/passwall_packages/$p" ]; then echo "  [OK]   $p"
            elif [ -d "package/feeds/packages/$p" ]; then echo "  [off]  $p (官方 feed 提供)"
            else echo "  [MISS] $p  <<< 需要关注"; fi
          done
          echo "=== geoview 必须【不存在】（go>=1.25 而 24.10 只有 1.23）==="
          if [ -d "package/feeds/passwall_packages/geoview" ] || [ -d "feeds/passwall_packages/geoview" ]; then
            echo "  !! geoview 仍在 → 会让 make 失败，退出"
            exit 1
          else
            echo "  OK: geoview 已彻底移除"
          fi

      # ★★★ Pin xray-core 到 v26.7.28 ★★★
      # ⚠️ 这一步必须放在 `Install PassWall packages` 之后 —— 只有那时
      #    package/feeds/passwall_packages/xray-core/ 才真的存在。
      #    （Run #8 就死在把它放在了 `Update feeds` 之前，
      #     那时 feeds/passwall_packages/ 这个目录还没被拉下来。）
      #
      # 为什么必须 pin：
      #   passwall_packages feed 是滚动 main，当前 xray-core 是 26.9.9，
      #   它的 go.mod 要求 go >= 1.27；而 openwrt-25.12 的 golang 是 1.26。
      #   → 直接用 feed 现状必然报 "requires go >= 1.27 (running go 1.26.x)"。
      #   v26.7.28 的 go.mod 是 "go 1.26"（无 toolchain 行）→ 正好匹配。
      # 只改两个变量：PKG_VERSION 和 PKG_HASH（hash 是官方 tarball 的 sha256）。
      # 两个位置都要改：源目录 feeds/ + 已软链的 package/feeds/。
      - name: Pin xray-core to v26.7.28
        run: |
          set -e
          cd openwrt
          H=a9afe86349c7bd3e6cae60125e62a5ada09d102e1a2760623e77c24a84dbfb46
          FOUND=0
          for MK in package/feeds/passwall_packages/xray-core/Makefile \
                    feeds/passwall_packages/xray-core/Makefile ; do
            if [ -f "$MK" ]; then
              cp -f "$MK" "$MK.bak"
              sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=26.7.28/' "$MK"
              sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$H/" "$MK"
              echo "=== $MK pin 后 ==="
              grep -nE '^(PKG_NAME|PKG_VERSION|PKG_HASH|PKG_SOURCE_URL):=' "$MK"
              grep -q '^PKG_VERSION:=26\.7\.28$' "$MK" || { echo "!! PKG_VERSION 没改成 26.7.28"; exit 1; }
              grep -q "^PKG_HASH:=$H\$" "$MK" || { echo "!! PKG_HASH 没改对"; exit 1; }
              FOUND=$((FOUND+1))
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "!! 两个位置都找不到 xray-core/Makefile —— feeds 结构变了，需人工核对"
            echo "--- package/feeds/passwall_packages 是否存在 ---"
            ls -d package/feeds/passwall_packages 2>/dev/null || echo "(不存在)"
            echo "--- 该目录下含 xray 的项 ---"
            ls package/feeds/passwall_packages/ 2>/dev/null | grep -i xray || echo "(无)"
            ls feeds/passwall_packages/ 2>/dev/null | grep -i xray || echo "(无)"
            exit 1
          fi
          echo "✅ xray-core 已 pin 到 v26.7.28 (go 1.26)，共改 $FOUND 处"

      # ★★★ 从 luci-app-passwall2 的 LUCI_DEPENDS 里摘掉 geoview ★★★
      # Run #9 死因之二。日志证据：
      #   WARNING: Makefile 'package/feeds/passwall2_luci/luci-app-passwall2/Makefile'
      #            has a dependency on 'geoview', which does not exist
      #   ERROR: unable to select packages:
      #     geoview (no such package):
      #       required by: luci-app-passwall2-26.9.16-r1[geoview]
      #       make[2]: *** [package/Makefile:100: package/install] Error 4
      #
      # 根因：我们把 geoview 从 passwall_packages feed 删掉了（省编译时间 + 非必需），
      #       但 passwall2 的 Makefile 里 `LUCI_DEPENDS:=... +geoview ...` 是**无条件**依赖。
      #       make defconfig 阶段只 WARNING，到 package/install 阶段就变成硬失败。
      # 修法：sed 掉那一行里的 geoview（保留 v2ray-geoip / v2ray-geosite）。
      - name: Drop geoview from passwall2 deps
        run: |
          set -e
          cd openwrt
          N=0
          for MK in package/feeds/passwall2_luci/luci-app-passwall2/Makefile \
                    feeds/passwall2_luci/luci-app-passwall2/Makefile ; do
            if [ -f "$MK" ]; then
              cp -f "$MK" "$MK.bak"
              # 只删 "+geoview " 这个依赖项，其余不动
              sed -i 's/^\(\s*\)+geoview\s\+/\1/' "$MK"
              sed -i 's/\s\+geoview$//' "$MK"
              echo "=== $MK 的 LUCI_DEPENDS ==="
              grep -n -A6 '^LUCI_DEPENDS' "$MK" || true
              if grep -q 'geoview' "$MK"; then
                echo "!! $MK 里仍有 geoview 残留"
                grep -n 'geoview' "$MK"
                exit 1
              fi
              N=$((N+1))
            fi
          done
          if [ "$N" -eq 0 ]; then
            echo "!! 两个位置都找不到 luci-app-passwall2/Makefile"
            ls -d package/feeds/passwall2_luci 2>/dev/null || echo "(package/feeds/passwall2_luci 不存在)"
            exit 1
          fi
          echo "✅ 已从 passwall2 依赖里摘掉 geoview，共改 $N 处"

      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-25.12-c526a" .config
          echo "=== 第一轮 defconfig（解析 select 依赖）==="
          make defconfig
          echo "第一轮 OK, exit=$?"

          # ================================================================
          # ★★★ 关键：PassWall 的 INCLUDE_xxx 是 config 层面的【select】关系。
          #    实测 `./scripts/config --set-val <opt> n` 和 `--unset` 都压不住
          #    随后的 `make defconfig` —— 它会把 INCLUDE_Haproxy/INCLUDE_Geoview
          #    重新拉回 =y（Run #6 就是这样又炸的）。
          #
          #    唯一可靠做法：在**最后一次** defconfig 之后，用 sed 直接改 .config，
          #    改完不再跑 defconfig。
          #
          #    ★ 教训：v1(passwall) 和 v2(passwall2) 各有独立的 INCLUDE_*，
          #      漏掉任何一套都会被拉回来（Run #6 漏的就是 passwall_INCLUDE_Haproxy）。
          # ================================================================
          echo "=== 第三轮 defconfig（先收敛）==="
          make defconfig

          echo "=== ★ 收尾：sed 直接把要关的项写死为 n（之后不再 defconfig）==="
          for opt in \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray_Plugin \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Geoview \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Hysteria \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_NaiveProxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadow_TLS \
            CONFIG_PACKAGE_shadowsocks-rust-sslocal \
            CONFIG_PACKAGE_shadowsocks-rust-ssserver \
            CONFIG_PACKAGE_hysteria \
            CONFIG_PACKAGE_v2ray-plugin \
            CONFIG_PACKAGE_xray-plugin \
            CONFIG_PACKAGE_shadow-tls \
            CONFIG_PACKAGE_geoview \
            CONFIG_PACKAGE_haproxy \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy ; do
            if grep -q "^${opt}=" .config; then
              sed -i "s|^${opt}=.*|# ${opt} is not set|" .config
            else
              printf '# %s is not set\n' "$opt" >> .config
            fi
          done
          echo "=== ★ 收尾复查（全部必须 not set / 未定义）==="
          BAD=0
          for opt in \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Geoview \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy \
            CONFIG_PACKAGE_geoview \
            CONFIG_PACKAGE_haproxy ; do
            got=$(grep -E "^${opt}=" .config || echo "  ${opt}  (未定义)")
            echo "  $got"
            case "$got" in
              *"=y"*) echo "     !! 仍为 y"; BAD=1 ;;
            esac
          done
          if [ "$BAD" -ne 0 ]; then
            echo "!! 收尾失败：仍有项被 select 拉回 y"
            exit 1
          fi
          echo "OK: geoview / haproxy 已全部关闭"
          echo "=== .config 是否生成成功 ==="
          ls -la .config && wc -l .config

      - name: Verify target, driver and PassWall
        run: |
          cd openwrt
          FAIL=0
          # ⚠️ 本步骤由 GitHub 以 `bash -e` 执行 → 任何 grep 无匹配(退 1)都会
          #    直接终止脚本。所以：① 所有「仅展示用」的 grep 一律 `|| true`；
          #    ② 所有「判定用」的 grep 用 `grep -c` 取值再数值比较，不要裸用。
          echo "=== target ==="
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)' .config || true
          echo ""
          echo "=== 设备是否存在（generic.mk）==="
          grep -A20 'define Device/hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 里没有 Device/hiwifi_c526a"; FAIL=1; }
          echo ""
          echo "=== files-6.12 DTS（补丁新增）==="
          ls -la target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 未落地"; FAIL=1; }
          echo ""
          echo "=== ipqess 补丁必须存在（上游 25.12 自带，实测 6 个含 ipqess 名）==="
          if [ ! -d target/linux/ipq40xx/patches-6.12 ]; then
            echo "!! patches-6.12 目录不存在"; FAIL=1
          else
            n=$(ls target/linux/ipq40xx/patches-6.12/ | grep -ci ipqess || true)
            echo "ipqess 相关补丁数 = $n（期望 >=6）"
            ls target/linux/ipq40xx/patches-6.12/ | grep -i ipqess || true
            [ "$n" -ge 6 ] || { echo "!! ipqess 补丁不足"; FAIL=1; }
            m=$(ls target/linux/ipq40xx/patches-6.12/ | grep -ci essedma || true)
            echo "essedma 相关补丁数 = $m（必须为 0）"
            [ "$m" -eq 0 ] || { echo "!! 仍有 essedma 补丁"; FAIL=1; }
            # DSA/switch 侧补丁（文件名不含 ipqess，但同属 ipqess+DSA 方案）
            echo "--- DSA/qca8k/switch 相关补丁（仅展示）---"
            ls target/linux/ipq40xx/patches-6.12/ | grep -Ei 'dsa|qca8k|switch' || echo "(无)"
          fi
          echo ""
          echo "=== 源码层二次确认：ipqess 源文件在、essedma 源文件不在 ==="
          find target/linux/ipq40xx -type d -name ipqess 2>/dev/null | head || true
          if find target/linux/ipq40xx -type d -name essedma 2>/dev/null | grep -q .; then
            echo "!! 存在 essedma 源码目录"; FAIL=1
          else
            echo "OK: 无 essedma 源码目录"
          fi
          echo ""
          echo "=== ★★ ipq-wifi-hiwifi_c526a 必须彻底不存在 ==="
          # 官方 ipq-wifi 包的 ALLWIFIBOARDS 里没有 hiwifi_c526a，也没有对应 BDF blob。
          # 一旦被 DEVICE_PACKAGES 或 .config 引用，`make download` 必然报：
          #   ERROR: package/firmware/ipq-wifi failed to build.
          # 校准数据改由 11-ath10k-caldata 从 mtd ART 分区现场提取。
          w1=$(grep -c 'ipq-wifi-hiwifi_c526a' .config 2>/dev/null || true)
          echo ".config 中 ipq-wifi-hiwifi_c526a 出现次数 = $w1（必须为 0）"
          [ "$w1" -eq 0 ] || { echo "!! .config 仍引用该不存在的包"; FAIL=1; }
          if grep -rq 'ipq-wifi-hiwifi_c526a' target/linux/ipq40xx/ 2>/dev/null; then
            echo "!! target/linux/ipq40xx 下仍有引用"; FAIL=1
          else
            echo "OK: target 下无引用"
          fi
          w2=$(grep -c 'hiwifi_c526a' package/firmware/ipq-wifi/Makefile 2>/dev/null || true)
          echo "ipq-wifi/Makefile 中 hiwifi_c526a 出现次数 = $w2（必须为 0）"
          [ "$w2" -eq 0 ] || { echo "!! ipq-wifi/Makefile 被污染了"; FAIL=1; }
          echo "--- 校准数据来源（11-ath10k-caldata，应有 c526a 分支）---"
          grep -B2 -A3 'c526a' target/linux/ipq40xx/base-files/etc/hotplug.d/firmware/11-ath10k-caldata \
            || { echo "!! 11-ath10k-caldata 里没有 c526a 分支"; FAIL=1; }
          echo ""
          echo "=== ★ PassWall 是否真的进了 .config ==="
          grep -E 'CONFIG_PACKAGE_luci-app-passwall(=|2=|_)|CONFIG_PACKAGE_luci-i18n-passwall' .config \
            || echo "!! PassWall 未进 config"
          echo ""
          echo "=== ★ 代理核心是否齐全 ==="
          # v2ray-geoip / v2ray-geosite 由 v2ray-geodata 包生成，config 里是独立的
          # CONFIG_PACKAGE_v2ray-geoip=y，所以这里按 config 项查是对的。
          # ⚠️ geoview 已从必需清单移除：它要 go>=1.25 而 24.10 只有 1.23 → 必炸。
          for p in xray-core sing-box chinadns-ng dns2socks microsocks ipt2socks \
                   shadowsocksr-libev-ssr-local shadowsocksr-libev-ssr-redir \
                   simple-obfs-client v2ray-geoip v2ray-geosite tcping lyaml; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  [OK]   $p"
            else
              echo "  [MISS] $p"
            fi
          done
          echo ""
          echo "=== ★★ 必须为 n 的包（含 geoview，Go 版本不兼容）★★ ==="
          for p in shadowsocks-rust-sslocal hysteria v2ray-plugin xray-plugin \
                   shadow-tls haproxy geoview; do
            v=$(grep -E "^CONFIG_PACKAGE_${p}=" .config 2>/dev/null | cut -d= -f2 || true)
            v=${v:-未定义}
            echo "  ${p} = ${v}"
            if [ "$v" = "y" ]; then
              echo "     !! 必须为 n / 未定义，否则编译会失败"
              FAIL=1
            fi
          done
          echo ""
          echo "=== ★★ PassWall v1/v2 的 INCLUDE_* 必须全关（select 关系，易被拉回）★★ ==="
          for opt in \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS \
            CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Geoview \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Hysteria \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client ; do
            v=$(grep -E "^${opt}=" .config 2>/dev/null | cut -d= -f2 || true)
            v=${v:-未定义}
            echo "  $(echo "$opt" | sed 's/^CONFIG_PACKAGE_luci-app-//') = ${v}"
            if [ "$v" = "y" ]; then
              echo "     !! 必须为 n —— 会把对应包拉进编译"
              FAIL=1
            fi
          done
          # geoview 源码目录也必须真的没了
          if [ -d feeds/passwall_packages/geoview ] || [ -d package/feeds/passwall_packages/geoview ]; then
            echo "!! geoview 源码目录仍在，会被 make 编译到"
            FAIL=1
          else
            echo "  OK: geoview 源码目录已移除"
          fi
          echo "=== ★★ geoview 不能残留在任何 Makefile 依赖里（Run #9 死因之二）★★ ==="
          gv=$(grep -rl 'geoview' package/feeds/*/luci-app-passwall*/Makefile 2>/dev/null | wc -l)
          echo "  仍依赖 geoview 的 luci Makefile 数 = $gv（必须为 0）"
          if [ "$gv" -ne 0 ]; then
            echo "  !! 下列 Makefile 仍写着 geoview（会在 package/install 阶段报 no such package）"
            grep -rl 'geoview' package/feeds/*/luci-app-passwall*/Makefile 2>/dev/null || true
            FAIL=1
          fi
          echo ""
          echo "=== ★★ xray-core 必须已 pin 到 v26.7.28（go 1.26）★★ ==="
          # 背景：feed 滚动的 26.9.9 要 go>=1.27，而 25.12 的 golang 是 1.26 → 必炸。
          XOK=0
          for XMK in package/feeds/passwall_packages/xray-core/Makefile \
                     feeds/passwall_packages/xray-core/Makefile ; do
            if [ -f "$XMK" ]; then
              echo "--- $XMK ---"
              grep -nE '^(PKG_VERSION|PKG_HASH):=' "$XMK" || true
              if grep -q '^PKG_VERSION:=26\.7\.28$' "$XMK"; then
                echo "  [OK]   $XMK 已 pin"
                XOK=$((XOK+1))
              else
                echo "  !! $XMK 的 PKG_VERSION 不是 26.7.28（会被 go 1.27 要求卡死）"; FAIL=1
              fi
            fi
          done
          [ "$XOK" -ge 1 ] || { echo "  !! 两处都没找到/没 pin xray-core"; FAIL=1; }
          echo ""
          echo "=== ★★ golang 工具链版本（25.12 应为 1.26）★★ ==="
          if [ -d tools/golang ]; then
            ls tools/golang/ || true
          fi
          grep -rhnE '^GO_DEFAULT_VERSION|^GO_VERSION_MAJOR_MINOR' \
            tools/golang/golang-values.mk tools/golang/golang-version.mk 2>/dev/null || true
          echo ""
          echo "=== ★★ iptables 互斥检查（Run #9 死因之一）★★ ==="
          # `iptables` 是虚拟提供者包，25.12 里 iptables-nft 优先级 100 胜出。
          # 同时显式开 iptables-zz-legacy 会让两个互斥包一起进 world，
          # 在 package/install 阶段报 "conflicts: ... [iptables=1.8.10-r3]" Error 4。
          in1=$(grep -cE '^CONFIG_PACKAGE_iptables-nft=y' .config || true)
          in2=$(grep -cE '^CONFIG_PACKAGE_iptables-zz-legacy=y' .config || true)
          echo "  iptables-nft=y        : $in1"
          echo "  iptables-zz-legacy=y  : $in2  （必须为 0）"
          if [ "$in2" -ne 0 ]; then
            echo "  !! iptables-zz-legacy 与 iptables-nft 互斥，会让 package/install 报 Error 4"
            FAIL=1
          fi
          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "!! 自检未通过（见上面 ! 标记），提前失败以便定位"
            exit 1
          fi
          echo "=== 全部自检通过 ==="

      - name: Download package sources
        # ⚠️ 这里不再 continue-on-error：Run #4 就是被它掩盖了
        #    "ERROR: package/firmware/ipq-wifi failed to build." 而一路绿灯。
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        # ★ 必须 set -o pipefail：
        #   `make ... | tee build.log` 的退出码取的是 tee（永远 0），
        #   不加 pipefail 的话 make 失败会被完全吞掉 → 假成功。
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -120 build.log || true
          echo "=== 错误行 ==="
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        # ★ 硬守门：编不出来就别装作成功
        if: always()
        run: |
          cd openwrt
          echo "=== bin/targets/ipq40xx 实际内容 ==="
          find bin/targets/ipq40xx -type f 2>/dev/null | head -40 || true
          echo ""
          n=$(find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" \) 2>/dev/null | wc -l)
          echo "固件镜像数 = $n（期望 >=1）"
          if [ "$n" -lt 1 ]; then
            echo "!! 没有任何固件镜像产出，构建实际失败。"
            echo "!! build.log 最后 60 行："
            tail -60 build.log 2>/dev/null || true
            exit 1
          fi

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \
            -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          # 顺便把编译出的 passwall ipk 也带上（以后想单独装也方便）
          find bin/packages -type f -name "*passwall*" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"
          cat bin/targets/ipq40xx/generic/*.buildinfo 2>/dev/null || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-25.12-ipqess-passwall-firmware
          path: output/
          # ★ 空目录直接失败，不再上传空壳
          if-no-files-found: error
          retention-days: 30
